name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The action's default package list includes "tools", which the SDK repository no longer
      # has. The platform is "android-37.0": there is no plain "android-37".
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch Nothing's Glyph SDK
        run: ./scripts/fetch-glyph-sdk.sh

      - name: Unit tests, screenshot check, lint, debug build
        run: ./gradlew :app:testDebugUnitTest :app:verifyPaparazziDebug :app:lintDebug assembleDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/paparazzi/
